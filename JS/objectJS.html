<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object in JS</title>
</head>
<body>
    <script>

        //object is a collection(pair) of keys(properties) and its values
        //create an object - using literal way and new keyword

        let student={name:"saksham",age:18,isMarried:false,address:{street:25,area:"noida",pincode:201029},education:["10th","12th","BTech"],degree:"BTech",branch:"CSE",year:2029, getInfo:function(){
            return  "my current education is" + student.degree;}
        }
        console.log(student);
        console.log(typeof(student));

        console.log(student.address.pincode);
        console.log(student.education[2]);
        console.log(student.getInfo());
        console.log(typeof(student));

        console.log('name' in student);
        console.log(delete student.name);
        console.log(student);
        let keys=Object.keys(student);
        console.log(keys.length);
        for(let i=0;i<keys.length;i++){
            console.log(keys[i],student[keys[i]]);
        }

        let myInfo=new Object();
        myInfo.name="saksham";
        myInfo.age=18;
        console.log(myInfo);
        console.log(typeof(myInfo));

    </script>
</body>
</html>
