<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Value Types in JS</title>
</head>
<body>
    <script>
        //JS Data Value Types
        //Primitive - immutable single value data type in js
        //String,Number,Boolean,Undefined,Null,BigInt and Symbol

        //String
        var myName="Saksham Kumar Sahdev";
        console.log(myName);

        //number
        var myMob=9810889048;
        console.log(myName+ "mobile number is" +myMob);

        //Boolean
        var isMarried=false;
        console.log(myName+ "is married?" +isMarried);

        //undefined
        var myEmail;
        console.log(myEmail);
        console.log(typeof(myEmail));

        //null
        var myAddress=null;
        console.log(myAddress);
        console.log(typeof(myAddress));

        //BigInt
        var myNum=BigInt(992229237899747294982487948);
        console.log(myNum);
        console.log(typeof(myNum));

        //Symbol
        var var1=Symbol("saksham");
        var var2=Symbol("saksham");
        console.log(var1==var2);

        //Reference Type(Object)--mutable in memory and keep the data in key value pair
        
        //object{},function(),array[]
        let myInfo={
             name:"Saksham",
             age:18,
             isMarried:false,
             address:"Delhi-08",
             branch:"CSE",
             section:23
        };
        console.log(myInfo);
        console.log(myInfo.name);

        //object length
        var keys=Object.keys(myInfo);
        console.log(keys.length);

        //function - reusable block of code which performs particular task
        
        function cal(){
            var num1=45;
            var num2=40;
            var add=num1+num2;
            console.log("Addition of two numbers is" +" "+ add);
        }
        cal();

        //array - collection of any data types
        let studentlist=["saksham","rahul","kunal","shubham"];
        console.log(studentlist[0]);
        
        //for different data types
        let student2List=["vikas",23,"akshat",18];
        console.log(student2List);
        console.log(student2List,length);

        //to itterate array member
        for(let i=0;i<student2List.length;i++){
            console.log(student2List[i]);
        }
        for(let x in student2List){
            console.log("updated way"+" "+student2List[x]);
        }

    </script>
</body>
</html>
