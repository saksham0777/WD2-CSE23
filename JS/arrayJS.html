<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array in JS</title>
</head>
<body>
    <script>
        // array is collection of any data types
        let num=[27,29,10,12,19];

        console.log(num.lastIndexOf(10));
        console.log(num.length);
        console.log(num.pop());
        console.log(num);
        console.log(num.push(100));
        console.log(num);
        console.log(num.shift());
        console.log(`updated array after shift ${num}`);
        console.log(num.unshift(50));
        console.log(`updated array after unshift ${num}`);
    </script>
</body>
</html>
