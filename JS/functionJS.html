<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function in JS</title>
</head>
<body>
    <script>
        // function - block of code which perform specific task
        // types of function
        // normal function - with para, without para and with default

        // normal function without parameters..

        function demo(){
            console.log("Hello JS");
        }
        demo(); // function calling

        // with parameters

        function demo1(text){
            console.log("Hello" + text);
        }
        demo1("React");
        // default parameters

        function add(a,b=12){
            console.log("Addition is" + (a+b));
        }
        add(12);

        // sync - Synchronous (sync) operations run sequentially, blocking further execution until a task completes, providing immediate consistency. Asynchronous (async) operations run concurrently or non-blockingly, allowing other tasks to proceed while waiting for a response, boosting efficiency and scalability in I/O-heavy applications.

        function cal(){
            function add(a,b){
                console.log(a+b);
            }
            function mul(x,y){
                console.log(x*y);
            }
            function sub(p,r){
                console.log(p-r);
            }
            add(2,4);
            mul(9,5);
            sub(9,7);
        }
        cal();

        //An anonymous function is a function definition without a specific name, created on-the-fly for short-term tasks, callbacks, or one-time use. They are commonly assigned to variables or passed directly to higher-order functions. Common in languages like Python (lambda), JavaScript (arrow functions), and Java, they improve code conciseness.

        let msg = function(){
            console.log("Hello ABES");
            console.log(typeof(msg));
        }
        msg();

        // short code for above function

        let msg1=()=>console.log("Hello ABESSSSS EC");
        msg1();

        // arrow function using multiple lines

        let msg2=(a,b)=>{
            var num1=a;
            var num2=b;
            var res=num1/num2;
            console.log("Result is" + res);
        }

        msg2(10,20);

        // IIFE - An IIFE (Immediately Invoked Function Expression) is a JavaScript function that runs as soon as it is defined.

        (function(){
            console.log("Hello World!");
        })();

        // short code for above function
        ((msg)=>console.log(msg))("saksham");

        let myPromise=new Promise(function(resolve, reject){
            let age=20;
            if(age>=18){
                resolve("valid");
            }
            else{
                reject("wait for next year");
            }
        });
        myPromise.then(msg=>console.log(msg)).catch(error=>console.log(error));
        
        // api.... https://dummyjson.com/products

        async function userInfo(){
            try{
            let userData=await fetch("https://dummyjson.com/products");
            let response=await userData.json();
            console.log(response);
            } // try end
            catch(error){
                console.log(error);
            } // catch end
        } // function end

        userInfo();

        // higher order function - A higher-order function is a function that can take other functions as arguments or return them as results, enabling functional programming techniques and promoting code reusability. Examples include map, filter, and reduce in JavaScript.

        let num=[1,2,3,4,5];
        let mapResult=num.map((value)=>{
            return value*2;
        });
        console.log(mapResult);
        let sum=num.reduce((total,n)=>total+n);
        console.log(sum);
        let sorting=num.filter(n=>n>2);
        console.log(sorting);
        num.forEach(n=>console.log(n*2));

        let myInfo={
            name:"Saksham",
            age:18,
            city:"noida"
        }
        localStorage.setItem("myInfo", JSON.stringify(myInfo));

        let storeData=JSON.parse(localStorage.getItem("myInfo"));
        console.log(storeData.name);

</script>
</body>
</html>
